openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Authentication and session operations
  - name: health
    description: Health operations
  - name: projects
    description: Project management operations
  - name: tasks
    description: Task management operations
  - name: dashboard
    description: Workspace overview operations
  - name: members
    description: Project membership operations
  - name: activity
    description: Project activity operations
paths:
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List owned projects
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 12
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update an owned project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Archive an owned project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
  /projects/{projectId}/activity:
    get:
      operationId: listProjectActivityByProject
      tags: [activity]
      summary: List project activity
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Paginated project activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogList"
        "404":
          description: Project not found
  /projects/{projectId}/delete:
    post:
      operationId: deleteProject
      tags: [projects]
      summary: Delete an owned project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project deleted
        "404":
          description: Project not found
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      tags: [members]
      summary: List project members
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "404":
          description: Project not found
    post:
      operationId: inviteProjectMember
      tags: [members]
      summary: Invite a registered user to a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInvite"
      responses:
        "201":
          description: Added project member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Insufficient project role
        "404":
          description: User or project not found
        "409":
          description: User is already a member
  /projects/{projectId}/members/{memberId}:
    patch:
      operationId: changeProjectMemberRole
      tags: [members]
      summary: Change a project member role
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "200":
          description: Updated project member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Only the owner can change roles
        "404":
          description: Project or member not found
    delete:
      operationId: removeProjectMember
      tags: [members]
      summary: Remove a project member
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed project member
        "403":
          description: Only the owner can remove members
        "404":
          description: Project or member not found
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: number
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [backlog, todo, in_progress, in_review, done]
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get workspace summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent workspace activity
      parameters:
        - name: projectName
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: number
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: number
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: number
  schemas:
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1
          maxLength: 72
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Project:
      type: object
      required: [id, name, key, description, color, ownerId, status, createdAt, updatedAt, taskCount, completedTaskCount]
      properties:
        id:
          type: number
        name:
          type: string
        key:
          type: string
        description:
          type: string
        color:
          type: string
        ownerId:
          type: number
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        taskCount:
          type: number
        completedTaskCount:
          type: number
    ProjectStatus:
      type: string
      enum: [active, on_hold, completed, archived]
    MemberRole:
      type: string
      enum: [owner, admin, member, viewer]
    Member:
      type: object
      required: [id, projectId, userId, name, email, role]
      properties:
        id:
          type: number
        projectId:
          type: number
        userId:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
    MemberInvite:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, member, viewer]
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, viewer]
    ProjectList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number
    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        key:
          type: string
          minLength: 1
          maxLength: 12
        description:
          type: string
          maxLength: 1000
        color:
          type: string
        status:
          type: string
          enum: [active, on_hold, completed]
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 1000
        color:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
    Task:
      type: object
      required: [id, projectId, title, description, status, priority, assignee, dueDate]
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assignee:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
    TaskInput:
      type: object
      required: [projectId, title]
      properties:
        projectId:
          type: number
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assignee:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assignee:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
    DashboardSummary:
      type: object
      required: [projectCount, openTaskCount, completedTaskCount, inProgressTaskCount, overdueTaskCount]
      properties:
        projectCount:
          type: number
        openTaskCount:
          type: number
        completedTaskCount:
          type: number
        inProgressTaskCount:
          type: number
        overdueTaskCount:
          type: number
    Activity:
      type: object
      required: [id, kind, message, projectName, createdAt]
      properties:
        id:
          type: number
        kind:
          type: string
          enum: [task_created, task_completed, project_created, task_updated]
        message:
          type: string
        projectName:
          type: string
        createdAt:
          type: string
          format: date-time
    ActivityLog:
      type: object
      required: [id, projectId, userId, actorName, projectName, action, metadata, message, createdAt]
      properties:
        id:
          type: number
        projectId:
          type: number
        userId:
          type: number
        actorName:
          type: string
        projectName:
          type: string
        action:
          type: string
          enum: [project_created, project_updated, user_invited, user_removed, role_changed, project_archived]
        metadata:
          type: object
          additionalProperties: true
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    ActivityLogList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number

